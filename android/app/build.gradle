plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.gityy34.tasbeh"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    // Keep Flutter native libraries compatible with Android 15/16 devices
    // that use different native page-size requirements.
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    defaultConfig {
        applicationId = "com.gityy34.tasbeh"
        // Keep the APK installable on current Android phones and older devices;
        // Flutter and the app's dependencies support API 21 and above.
        minSdk = 21
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // This makes the CI demo APK directly installable. Replace this with
            // a private production signing config before publishing to Google Play.
            signingConfig = signingConfigs.getByName("debug")
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source = "../.."
}

