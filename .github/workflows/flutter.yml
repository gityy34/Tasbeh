name: Flutter checks and Android artifacts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build universal release APK
        run: flutter build apk --release

      - name: Build smaller ABI-specific APKs
        run: flutter build apk --release --split-per-abi

      - name: Build release App Bundle
        run: flutter build appbundle --release

      - name: Verify APK signatures and package integrity
        shell: bash
        run: |
          set -euo pipefail
          build_tools_dir="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          for apk in build/app/outputs/flutter-apk/*.apk; do
            echo "Verifying ${apk}"
            unzip -t "${apk}" >/dev/null
            "${build_tools_dir}/apksigner" verify --verbose "${apk}"
          done

      - name: Upload small Android 12+ demo APK
        uses: actions/upload-artifact@v4
        with:
          name: tasbeh-demo-apk
          if-no-files-found: error
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Upload universal fallback APK
        uses: actions/upload-artifact@v4
        with:
          name: tasbeh-universal-apk
          if-no-files-found: error
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload smaller ABI APKs
        uses: actions/upload-artifact@v4
        with:
          name: tasbeh-small-apks
          if-no-files-found: error
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: tasbeh-android-aab
          if-no-files-found: error
          path: build/app/outputs/bundle/release/app-release.aab

