name: Flutter checks and Android artifacts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  verify-and-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Remove previous Tasbeh artifacts
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          artifact_ids="$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | startswith("tasbeh-")) | .id')"
          if [[ -z "${artifact_ids}" ]]; then
            echo "No previous Tasbeh artifacts found."
            exit 0
          fi
          while IFS= read -r artifact_id; do
            [[ -z "${artifact_id}" ]] && continue
            echo "Deleting Tasbeh artifact ${artifact_id}"
            gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
          done <<< "${artifact_ids}"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run tests
        run: flutter test test/tasbeh_controller_test.dart test/water_counter_test.dart test/home_screen_test.dart

      - name: Capture real UI screenshots
        run: flutter test --update-goldens --timeout 2m test/ui_screenshot_test.dart

      - name: Build universal release APK
        if: github.event_name != 'pull_request'
        run: flutter build apk --release

      - name: Build smaller ABI-specific APKs
        if: github.event_name != 'pull_request'
        run: flutter build apk --release --split-per-abi

      - name: Build release App Bundle
        if: github.event_name != 'pull_request'
        run: flutter build appbundle --release

      - name: Verify APK signatures and package integrity
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          build_tools_dir="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          for apk in build/app/outputs/flutter-apk/*.apk; do
            echo "Verifying ${apk}"
            unzip -t "${apk}" >/dev/null
            "${build_tools_dir}/apksigner" verify --verbose "${apk}"
          done

      - name: Publish direct demo release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="tasbeh-demo-${GITHUB_RUN_NUMBER}"
          gh release create "${tag}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Tasbeh demo ${GITHUB_RUN_NUMBER}" \
            --notes "Realistic Water Theme demo. The arm64 APK is the smaller Android 12+ download; the universal APK is the compatibility fallback." \
            "build/app/outputs/flutter-apk/app-arm64-v8a-release.apk#tasbeh-realistic-water-arm64.apk" \
            "build/app/outputs/flutter-apk/app-release.apk#tasbeh-realistic-water-universal.apk"

