name: Flutter checks and Android artifacts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  verify-and-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Remove previous Tasbeh artifacts
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          artifact_ids="$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | startswith("tasbeh-")) | .id')"
          if [[ -z "${artifact_ids}" ]]; then
            echo "No previous Tasbeh artifacts found."
            exit 0
          fi
          while IFS= read -r artifact_id; do
            [[ -z "${artifact_id}" ]] && continue
            echo "Deleting Tasbeh artifact ${artifact_id}"
            gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
          done <<< "${artifact_ids}"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run tests
        run: flutter test test/tasbeh_controller_test.dart test/water_counter_test.dart test/home_screen_test.dart test/reminder_controller_test.dart test/notification_schedule_test.dart test/azkar_controller_test.dart test/azkar_screen_test.dart

      - name: Capture real UI screenshots
        run: flutter test --update-goldens --timeout 2m test/ui_screenshot_test.dart

      - name: Upload real UI screenshots for preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tasbeh-ui-screenshots
          path: test/goldens/*.png
          if-no-files-found: error

      - name: Compile Android Kotlin without packaging APK
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          flutter_bin="$(readlink -f "$(command -v flutter)")"
          flutter_sdk="$(cd "$(dirname "${flutter_bin}")/.." && pwd)"
          printf 'flutter.sdk=%s\n' "${flutter_sdk}" > android/local.properties
          (cd android && ./gradlew :app:compileReleaseKotlin --no-daemon)

      - name: Build universal release APK
        if: github.event_name != 'pull_request'
        run: flutter build apk --release --build-number "${GITHUB_RUN_NUMBER}"

      - name: Build smaller ABI-specific APKs
        if: github.event_name != 'pull_request'
        run: flutter build apk --release --split-per-abi --build-number "${GITHUB_RUN_NUMBER}"

      - name: Build release App Bundle
        if: github.event_name != 'pull_request'
        run: flutter build appbundle --release --build-number "${GITHUB_RUN_NUMBER}"

      - name: Verify APK signatures and package integrity
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          build_tools_dir="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          for apk in build/app/outputs/flutter-apk/*.apk; do
            echo "Verifying ${apk}"
            unzip -t "${apk}" >/dev/null
            "${build_tools_dir}/zipalign" -c -v 4 "${apk}" >/dev/null
            "${build_tools_dir}/apksigner" verify --verbose "${apk}"
            package_line="$("${build_tools_dir}/aapt2" dump badging "${apk}" | head -n 1)"
            echo "${package_line}"
            grep -Fq "package: name='com.gityy34.tasbeh'" <<< "${package_line}"
          done

          aab="build/app/outputs/bundle/release/app-release.aab"
          echo "Verifying ${aab}"
          unzip -t "${aab}" >/dev/null
          jarsigner -verify "${aab}" >/dev/null

          version_name="$(sed -n 's/^version: \([^+[:space:]]*\).*/\1/p' pubspec.yaml)"
          asset_prefix="tasbeh-v${version_name}"
          echo "Preparing ${asset_prefix} APKs with build number ${GITHUB_RUN_NUMBER}"

          # Make the safe universal package the first, clearly versioned download.
          cp build/app/outputs/flutter-apk/app-release.apk "${asset_prefix}-universal.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "${asset_prefix}-arm64.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "${asset_prefix}-armv7.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk "${asset_prefix}-x86_64.apk"
          cp build/app/outputs/bundle/release/app-release.aab "${asset_prefix}.aab"

      - name: Publish direct demo release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version_name="$(sed -n 's/^version: \([^+[:space:]]*\).*/\1/p' pubspec.yaml)"
          asset_prefix="tasbeh-v${version_name}"
          tag="tasbeh-v${version_name}-build${GITHUB_RUN_NUMBER}"
          gh release create "${tag}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Tasbeh v${version_name}" \
            --notes "Tasbeh v${version_name}. Install the universal APK if your device architecture is unknown; use an ABI-specific APK only when the device architecture is confirmed." \
            "${asset_prefix}-universal.apk" \
            "${asset_prefix}-arm64.apk" \
            "${asset_prefix}-armv7.apk" \
            "${asset_prefix}-x86_64.apk" \
            "${asset_prefix}.aab"

