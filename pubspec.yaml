name: tasbeh
description: A calm, accessible Tasbeh counter for Android.
publish_to: "none"
# Version name increments for every downloadable APK release. CI supplies a
# monotonically increasing Android build number from the GitHub run number.
version: 1.0.8+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.2
  shared_preferences: ^2.5.3
  timezone: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/splash_day.jpg
    - assets/images/splash_night.jpg
